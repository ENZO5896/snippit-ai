<!DOCTYPE html>
<html>
<head>
  <title>SNIPPIT AI</title>
  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: white;
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    #chat {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
    }

    .msg {
      margin: 5px 0;
      padding: 10px;
      border-radius: 8px;
      max-width: 70%;
    }

    .user {
      background: #dbeafe;
      margin-left: auto;
    }

    .ai {
      background: #eee;
      margin-right: auto;
    }

    #inputArea {
      display: flex;
      padding: 10px;
      background: white;
      border-top: 1px solid #ddd;
    }

    #text {
      flex: 1;
      padding: 10px;
    }

    button {
      margin-left: 10px;
      padding: 10px;
      background: #2563eb;
      color: white;
      border: none;
    }
  </style>
</head>

<body>

<header>
  <b>SNIPPIT AI</b>
</header>

<div id="chat"></div>

<div id="inputArea">
  <input id="text" placeholder="Type message...">
  <button onclick="send()">Send</button>
</div>

<script>

function addMsg(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;

  document.getElementById("chat").appendChild(div);
}

async function send() {
  const input = document.getElementById("text");
  const msg = input.value.trim();
  if (!msg) return;

  addMsg(msg, "user");
  input.value = "";

  const res = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: msg })
  });

  const data = await res.json();

  addMsg(data.reply || "Error getting response", "ai");
}
}

</script>

</body>
</html>
