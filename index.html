<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIPPIT AI</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

header {
  background: white;
  padding: 10px;
  border-bottom: 1px solid #ddd;
}

#chat {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
}

.msg {
  max-width: 70%;
  padding: 10px;
  margin: 6px 0;
  border-radius: 8px;
}

.user {
  background: #dbeafe;
  margin-left: auto;
}

.ai {
  background: #eee;
  margin-right: auto;
}

#inputArea {
  display: flex;
  padding: 10px;
  background: white;
  border-top: 1px solid #ddd;
}

#text {
  flex: 1;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 6px;
}

button {
  margin-left: 10px;
  padding: 10px;
  border: none;
  background: #2563eb;
  color: white;
  border-radius: 6px;
}
</style>
</head>

<body>

<header>
  <b>SNIPPIT AI</b>
</header>

<div id="chat"></div>

<div id="inputArea">
  <input id="text" placeholder="Message SNIPPIT AI...">
  <button onclick="send()">Send</button>
</div>

<script>

const chat = document.getElementById("chat");

function send() {
  async function send() {
  const input = document.getElementById("text");
  const msg = input.value.trim();
  if (!msg) return;

  addMsg(msg, "user");
  input.value = "";

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: msg })
    });

    const data = await res.json();

    addMsg(data.reply || "No response from AI", "ai");

  } catch (error) {
    addMsg("Error connecting to AI", "ai");
  }
}
}

function addMsg(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

</script>
<h1>SNIPPIT TEST CHANGE</h1>
</body>
</html>
