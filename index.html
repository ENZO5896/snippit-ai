<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIPPIT AI</title>

<style>
:root {
  --bg: #f7f7f7;
  --text: #111;
  --card: #ffffff;
  --user: #dbeafe;
  --ai: #eeeeee;
  --border: #ddd;
}

body.dark {
  --bg: #0f0f0f;
  --text: #ffffff;
  --card: #1a1a1a;
  --user: #1e3a5f;
  --ai: #2a2a2a;
  --border: #333;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */
header {
  background: var(--card);
  padding: 10px;
  display: flex;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}

/* CHAT */
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

.msg {
  max-width: 75%;
  padding: 10px;
  margin: 8px 0;
  border-radius: 10px;
}

.user { background: var(--user); margin-left: auto; }
.ai { background: var(--ai); margin-right: auto; }

/* INPUT */
#inputArea {
  display: flex;
  padding: 10px;
  background: var(--card);
  border-top: 1px solid var(--border);
}

#text {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
}

button {
  margin-left: 8px;
  padding: 10px 12px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  background: #2563eb;
  color: white;
}

/* LOGIN SCREEN */
#login {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

#loginBox {
  background: var(--card);
  padding: 20px;
  border-radius: 10px;
  width: 280px;
  text-align: center;
  border: 1px solid var(--border);
}

#loginBox input {
  width: 90%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
}

.hidden { display: none; }
</style>
</head>

<body>

<!-- LOGIN SCREEN -->
<div id="login">
  <div id="loginBox">
    <h3>Welcome to SNIPPIT AI</h3>
    <input id="nameInput" placeholder="Enter username..." />
    <button onclick="startApp()">Continue</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden">

<header>
  <div>SNIPPIT AI</div>
  <div>
    <button onclick="toggleTheme()">🌗</button>
  </div>
</header>

<div id="chat"></div>

<div id="inputArea">
  <input id="text" placeholder="Message SNIPPIT AI..." />
  <button onclick="send()">Send</button>
</div>

</div>

<script>
const chat = document.getElementById("chat");
let username = localStorage.getItem("snippit_name");

function startApp() {
  const input = document.getElementById("nameInput").value.trim();
  if (!input) return;

  username = input;
  localStorage.setItem("snippit_name", username);

  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  addMsg("Hello " + username + "! 👋", "ai");
}

if (username) {
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  setTimeout(() => addMsg("Welcome back " + username + " 👋", "ai"), 300);
}

function send() {
  const input = document.getElementById("text");
  const msg = input.value.trim();
  if (!msg) return;

  addMsg(username + ": " + msg, "user");
  input.value = "";

  setTimeout(() => {
    addMsg("SNIPPIT AI is not connected yet.", "ai");
  }, 600);
}

function addMsg(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function toggleTheme() {
  document.body.classList.toggle("dark");
}
</script>

</body>
</html>
