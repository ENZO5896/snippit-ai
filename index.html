<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIPPIT AI</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f7f7f7;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

header {
  background: white;
  padding: 12px;
  display: flex;
  justify-content: space-between;
  border-bottom: 1px solid #ddd;
}

header h1 {
  font-size: 16px;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

.msg {
  max-width: 75%;
  padding: 10px;
  margin: 8px 0;
  border-radius: 10px;
}

.user {
  background: #dbeafe;
  margin-left: auto;
}

.ai {
  background: #eee;
  margin-right: auto;
}

#inputArea {
  display: flex;
  padding: 10px;
  border-top: 1px solid #ddd;
  background: white;
}

#text {
  flex: 1;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 8px;
}

button {
  margin-left: 8px;
  padding: 10px 15px;
  border: none;
  background: #2563eb;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}
</style>
</head>

<body>

<header>
  <h1>SNIPPIT AI</h1>
</header>

<div id="chat"></div>

<div id="inputArea">
  <input id="text" placeholder="Message SNIPPIT AI..." />
  <button onclick="send()">Send</button>
</div>

<script>
const chat = document.getElementById("chat");

function send() {
  const input = document.getElementById("text");
  const msg = input.value.trim();
  if (!msg) return;

  addMsg(msg, "user");
  input.value = "";

  setTimeout(() => {
    addMsg("AI not connected yet. Waiting for backend setup.", "ai");
  }, 600);
}

function addMsg(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
