<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SNIPPIT-AI</title>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>SNIPPIT-AI</h2>
    <button class="new-chat">+ New Chat</button>

    <div class="chat-history">
      <p>What is AI?</p>
      <p>Business ideas</p>
      <p>Study plan</p>
    </div>
  </div>

  <!-- MAIN CHAT -->
  <div class="main">

    <div class="topbar">
      <h3>Chat</h3>
    </div>

    <div id="chatBox" class="chat-box"></div>

    <div class="input-area">
      <input id="input" placeholder="Ask SNIPPIT-AI..." />
      <button onclick="sendMessage()">Send</button>
    </div>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
