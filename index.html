<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SNIPPIT-AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f0f0f;
      color: white;
    }

    #loginPage {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #loginPage input {
      padding: 10px;
      margin: 5px;
      width: 220px;
    }

    #loginPage button {
      padding: 10px;
      margin-top: 10px;
      background: #4a90e2;
      border: none;
      color: white;
      cursor: pointer;
    }

    #app {
      display: none;
      flex-direction: column;
      height: 100vh;
    }

    .topbar {
      background: #1a1a1a;
      padding: 10px;
      display: flex;
      justify-content: space-between;
    }

    .chat-box {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
    }

    .input-area {
      display: flex;
      padding: 10px;
      background: #1a1a1a;
    }

    .input-area input {
      flex: 1;
      padding: 10px;
    }

    .input-area button {
      padding: 10px;
      margin-left: 10px;
      background: #4a90e2;
      border: none;
      color: white;
    }

    .msg {
      margin: 8px;
      padding: 10px;
      border-radius: 8px;
      max-width: 70%;
    }

    .user { background: #4a90e2; margin-left: auto; }
    .ai { background: #2a2a2a; }
  </style>

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>

<body>

<div id="loginPage">
  <h1>SNIPPIT-AI</h1>

  <input id="email" placeholder="Email" />
  <input id="password" type="password" placeholder="Password" />

  <button onclick="loginWithGoogle()">Continue with Google</button>
  <button onclick="emailLogin()">Login with Email</button>
  <button onclick="registerWithEmail()">Register with Email</button>
  <p style="color: #ccc; margin-top: 10px; max-width: 260px; text-align: center;">Already registered? Click Login. New users can click Register.</p>
</div>

<div id="app">
  <div class="topbar">
    <h3>SNIPPIT-AI</h3>
    <button onclick="logout()">Logout</button>
  </div>

  <div id="chatBox" class="chat-box"></div>

  <div class="input-area">
    <input id="input" placeholder="Ask SNIPPIT-AI..." />
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
/* FIREBASE CONFIG (FIXED) */
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDpIjP2oq2SpU-2pvtLjBkFB6-KzEl9NnI",
  authDomain: "snippit-ai.firebaseapp.com",
  projectId: "snippit-ai",
  storageBucket: "snippit-ai.firebasestorage.app",
  messagingSenderId: "143652560651",
  appId: "1:143652560651:web:2f479355701b8fd48ecc0e",
  measurementId: "G-Y1Z9X72JEG"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

/* UI */
function showApp() {
  document.getElementById("loginPage").style.display = "none";
  document.getElementById("app").style.display = "flex";
}

function showLogin() {
  document.getElementById("loginPage").style.display = "flex";
  document.getElementById("app").style.display = "none";
}

/* AUTH STATE */
auth.onAuthStateChanged(user => {
  if (user) showApp();
  else showLogin();
});

/* GOOGLE LOGIN */
function loginWithGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider)
    .then(() => showApp())
    .catch(err => {
      alert(err.message);
      console.error(err);
    });
}

/* EMAIL LOGIN */
function emailLogin() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, password)
    .then(() => showApp())
    .catch(err => {
      if (err.code === "auth/user-not-found") {
        auth.createUserWithEmailAndPassword(email, password)
          .then(() => showApp())
          .catch(createErr => alert(createErr.message));
      } else {
        alert(err.message);
        console.error(err);
      }
    });
}


/* LOGOUT */
function logout() {
  auth.signOut();
}

/* CHAT (TEMP) */
function sendMessage() {
  const input = document.getElementById("input");
  const text = input.value;
  if (!text) return;

  const chatBox = document.getElementById("chatBox");

  const userMsg = document.createElement("div");
  userMsg.className = "msg user";
  userMsg.innerText = text;
  chatBox.appendChild(userMsg);

  input.value = "";

  setTimeout(() => {
    const aiMsg = document.createElement("div");
    aiMsg.className = "msg ai";
    aiMsg.innerText = "SNIPPIT AI backend coming soon 🚀";
    chatBox.appendChild(aiMsg);
  }, 500);
}
</script>
<script src="script.js"></script>
</body>
</html>
