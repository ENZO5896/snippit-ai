<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIPPIT AI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    flex-direction:column;
    background:#f6f7fb;
    overflow:hidden;
}

/* TOP BAR */
header{
    background:#fff;
    padding:12px 15px;
    border-bottom:1px solid #e6e6e6;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.menu{
    font-size:22px;
    cursor:pointer;
}

.brand{
    font-weight:bold;
}

.profile{
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
}

.avatar{
    width:32px;
    height:32px;
    border-radius:50%;
    background:#ccc;
}

/* APP WRAPPER */
#app{
    flex:1;
    display:flex;
    position:relative;
    overflow:hidden;
}

/* OVERLAY */
#overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.35);
    display:none;
    z-index:5;
}

/* SIDEBAR */
#sidebar{
    position:absolute;
    left:-280px;
    top:0;
    bottom:0;
    width:280px;
    background:#fff;
    transition:0.3s ease;
    z-index:6;
    display:flex;
    flex-direction:column;
    padding:10px;
}

#sidebar.open{
    left:0;
}

.side-item{
    padding:12px;
    border-radius:10px;
    cursor:pointer;
}

.side-item:hover{
    background:#f1f1f1;
}

/* CHAT AREA */
#chatArea{
    flex:1;
    display:flex;
    flex-direction:column;
}

/* CHAT */
#chat{
    flex:1;
    overflow-y:auto;
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.msg{
    padding:10px 12px;
    border-radius:14px;
    max-width:75%;
    line-height:1.4;
}

.user{
    background:#dbeafe;
    align-self:flex-end;
}

.ai{
    background:#eee;
    align-self:flex-start;
}

/* INPUT */
#inputBar{
    display:flex;
    gap:8px;
    padding:10px;
    background:#fff;
    border-top:1px solid #e6e6e6;
}

#text{
    flex:1;
    padding:10px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
}

#send{
    padding:10px 14px;
    border:none;
    border-radius:10px;
    background:#111;
    color:#fff;
    cursor:pointer;
}

#plus{
    width:40px;
    border:none;
    border-radius:10px;
    background:#eee;
    cursor:pointer;
}

/* CHAT HISTORY AREA */
#chatHistory{
    margin-top:10px;
    display:flex;
    flex-direction:column;
    gap:5px;
}
</style>
</head>

<body>

<header>
<div class="topbar">
    <div class="menu" onclick="toggleSidebar()">☰</div>
    <div class="brand">SNIPPIT AI</div>

    <div class="profile">
        <span id="username">Enzo</span>
        <div class="avatar"></div>
    </div>
</div>
</header>

<div id="app">

<!-- OVERLAY -->
<div id="overlay" onclick="toggleSidebar()"></div>

<!-- SIDEBAR -->
<div id="sidebar">

    <div class="side-item" onclick="createNewChat()">➕ New Chat</div>

    <div id="chatHistory"></div>

</div>

<!-- CHAT AREA -->
<div id="chatArea">

    <div id="chat"></div>

    <div id="inputBar">
        <button id="plus">+</button>
        <input id="text" placeholder="Message SNIPPIT AI...">
        <button id="send" onclick="sendMessage()">➤</button>
    </div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
